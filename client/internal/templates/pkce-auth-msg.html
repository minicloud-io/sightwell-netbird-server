        .icon { width: 44px; height: 44px; margin: 0 auto 16px; display: block; }
        h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }

        .error {
            margin-top: 12px; padding: 10px 12px; border-radius: 6px; text-align: left;
            background: var(--bad-bg); color: var(--bad); font-size: 14px; word-break: break-word;
