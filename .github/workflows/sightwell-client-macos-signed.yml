# Sightwell fork: builds the macOS installer package signed with MINICLOUD
# FZCO's Developer ID (team US5JKY7Z7F), notarises and staples it, and keeps it
# as a workflow artifact. Nothing is published: attaching it to a release is a
# separate, approved step.
#
# Secrets live in the "macos-signing" environment, whose required reviewer
# approves every run before any secret is handed to the job:
#   MACOS_SIGNING_P12           base64 of one .p12 holding the Developer ID
#                               Application and Developer ID Installer identities
#   MACOS_SIGNING_P12_PASSWORD  its export password
#   ASC_API_KEY_P8              App Store Connect API key (.p8 contents, Developer role)
#   ASC_API_KEY_ID              its key ID
#   ASC_API_ISSUER_ID           the issuer ID
name: Sightwell client (macOS, signed)

on:
  # Manual runs need this file on the default branch (GitHub rule); tags work
  # from any branch.
  push:
    tags: ["v*-sightwell.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (default: the tag, or git describe of the nearest v*-sightwell.* tag + -dev)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sightwell-client-macos-signed-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: US5JKY7Z7F

jobs:
  package:
    runs-on: macos-latest
    environment: macos-signing
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install wails3 and task
        # wails3 matches the Wails version go.mod requires (as upstream's release does).
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          if [ -z "$v" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="$GITHUB_REF_NAME"
          fi
          if [ -z "$v" ]; then
            v="$(git describe --tags --match 'v*-sightwell.*' --abbrev=0 2>/dev/null || echo v0.0.0-sightwell.0)-dev"
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing identities
        # A throwaway keychain, passed to codesign and productbuild by path; the
        # job's search list is not changed.
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/sightwell-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          app_id=$(security find-identity -v -p codesigning "$KEYCHAIN" |
            sed -n "s/.*\"\(Developer ID Application: .* ($TEAM_ID)\)\".*/\1/p" | head -n 1)
          pkg_id=$(security find-identity -v -p basic "$KEYCHAIN" |
            sed -n "s/.*\"\(Developer ID Installer: .* ($TEAM_ID)\)\".*/\1/p" | head -n 1)
          if [ -z "$app_id" ] || [ -z "$pkg_id" ]; then
            echo "::error::the .p12 must hold valid Developer ID Application and Installer identities of team $TEAM_ID"
            security find-identity -v "$KEYCHAIN"
            exit 1
          fi
          {
            echo "SIGN_KEYCHAIN=$KEYCHAIN"
            echo "SIGN_APP_IDENTITY=$app_id"
            echo "SIGN_PKG_IDENTITY=$pkg_id"
          } >> "$GITHUB_ENV"

      - name: Build signed package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh release_files/sightwell-macos-pkg.sh "$VERSION" dist/sightwell-macos

      - name: Notarise and staple
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$ASC_KEY_PATH"
          sh release_files/sightwell-macos-notarize.sh "dist/sightwell-macos/Sightwell-$VERSION.pkg"

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc-api-key.p8" "$RUNNER_TEMP/signing.p12"
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sightwell-macos-${{ steps.version.outputs.version }}
          path: dist/sightwell-macos/
          retention-days: 30
          if-no-files-found: error
